<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F4F7FB">
  <title>ГТО · Нет подключения</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f7fb; --surface: #fff; --text: #16202c; --muted: #536279; --border: #e3e8f0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e131a; --surface: #161d26; --text: #e8edf4; --muted: #a7b3c4; --border: #26313f; }
    }
    * { box-sizing: border-box; }
    body { min-height: 100svh; display: grid; place-items: center; margin: 0; padding: 20px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 400px); text-align: center; padding: 28px 22px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; }
    .logo { display: grid; place-items: center; margin: 0 auto 16px; width: 50px; height: 50px; border-radius: 14px; background: linear-gradient(135deg,#583ae2,#007d68); color: #fff; font-weight: 800; }
    h1 { margin: 0; font-size: 24px; line-height: 1.25; }
    p { color: var(--muted); margin: 12px 0 20px; }
    a { display: inline-grid; place-items: center; min-height: 44px; padding: 0 18px; border-radius: 11px; background: #5540d5; color: white; text-decoration: none; font-weight: 600; }
    a:focus-visible { outline: 2px solid #7766ef; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">ГТО</div>
    <h1>Нет подключения</h1>
    <p>Подключитесь к интернету, чтобы открыть актуальные данные ГТО.</p>
    <a href="">Повторить</a>
  </main>
</body>
</html>
